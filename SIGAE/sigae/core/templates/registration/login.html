{% load static %}<!DOCTYPE html>
<html lang="pt-br"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · SIGAE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/sigae.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100" style="background:#f6f7fc">
<div class="container" style="max-width:420px">
  <div class="card shadow-sm border-0"><div class="card-body p-4">
    <h1 class="sigae-brand text-center h2">SIGAE</h1>
    <p class="text-center text-muted">Sistema Inteligente de Gestão de Ativos e Empréstimos</p>
    {% if form.errors %}<div class="alert alert-danger">Usuário ou senha inválidos.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Usuário</label><input name="username" class="form-control" autofocus required></div>
      <div class="mb-3"><label class="form-label">Senha</label><input name="password" type="password" class="form-control" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
  </div></div>
</div>
</body></html>
